<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#020617" id="theme-color-meta" />
    <meta name="google-site-verification" content="-7Pv4KbpvWcJ3ExK0pFdbLNpIh5k8Jit3VOIit7by9Y" />
    <meta name="robots" content="index, follow" />
    <title>Uniplan</title>
    <meta name="description" content="University course schedule builder, scenario planner with multi-plan ghost comparison, collision detector, and calendar exporter." />
    <meta name="screen-orientation" content="portrait" />
    <meta name="x5-orientation" content="portrait" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Uniplan" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:title" content="Uniplan" />
    <meta property="og:description" content="University course schedule builder, scenario planner with multi-plan ghost comparison, collision detector, and calendar exporter." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400..800&family=JetBrains+Mono:wght@400..600&display=swap">
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('uniplan_theme');
          if (theme !== 'dark' && theme !== 'light') {
            var raw = localStorage.getItem('uniplan_schedule_storage_v2');
            if (raw) {
              var parsed = JSON.parse(raw);
              var persisted = parsed && parsed.state && parsed.state.theme;
              if (persisted === 'dark' || persisted === 'light') theme = persisted;
            }
          }
          var isDark = theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var meta = document.getElementById('theme-color-meta');
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
            if (meta) meta.setAttribute('content', '#020617');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
            if (meta) meta.setAttribute('content', '#f7f8fb');
          }
          var standalone = window.matchMedia('(display-mode: standalone)').matches
            || window.matchMedia('(display-mode: fullscreen)').matches
            || window.navigator.standalone === true;
          if (standalone) {
            document.documentElement.classList.add('up-standalone');
            try {
              if (screen.orientation && typeof screen.orientation.lock === 'function') {
                screen.orientation.lock('portrait').catch(function() {});
              }
            } catch (err) {}
          }
        } catch (e) {}
      })();
    </script>
    <style>
      html, body, #root { background-color: #f7f8fb; }
      html.dark, html.dark body, html.dark #root { background-color: #020617; }
    </style>
  </head>
  <body class="bg-[#f7f8fb] dark:bg-[#020617] text-slate-900 dark:text-slate-100 antialiased font-sans selection:bg-indigo-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
