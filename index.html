<!doctype html>
<html lang="en" class="up-preload">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#070707" id="theme-color-meta" />
    <meta name="google-site-verification" content="-7Pv4KbpvWcJ3ExK0pFdbLNpIh5k8Jit3VOIit7by9Y" />
    <meta name="robots" content="index, follow" />
    <title>Uniplan</title>
    <meta name="description" content="University course schedule builder, scenario planner with multi-plan ghost comparison, collision detector, and calendar exporter." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Uniplan" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:title" content="Uniplan" />
    <meta property="og:description" content="University course schedule builder, scenario planner with multi-plan ghost comparison, collision detector, and calendar exporter." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400..800&family=JetBrains+Mono:wght@400..600&display=swap">
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('uniplan_theme');
          // Explicit "system" follows the OS. Do not replace it with the blob's last resolved theme.
          if (theme !== 'system' && theme !== 'dark' && theme !== 'light') {
            var raw = localStorage.getItem('uniplan_schedule_storage_v2');
            if (raw) {
              var parsed = JSON.parse(raw);
              var persisted = parsed && parsed.state && parsed.state.theme;
              if (persisted === 'dark' || persisted === 'light') theme = persisted;
            }
          }
          var isDark = theme === 'dark' || (theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var meta = document.getElementById('theme-color-meta');
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
            if (meta) meta.setAttribute('content', '#070707');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
            if (meta) meta.setAttribute('content', '#f7f8fb');
          }
          var standalone = window.matchMedia('(display-mode: standalone)').matches
            || window.matchMedia('(display-mode: fullscreen)').matches
            || window.navigator.standalone === true;
          if (standalone) {
            document.documentElement.classList.add('up-standalone');
            try {
              if (window.innerWidth < 640 && screen.orientation && typeof screen.orientation.lock === 'function') {
                screen.orientation.lock('portrait').catch(function() {});
              }
            } catch (err) {}
          }

          // Fail-safe: ensure launch splash is never permanently stuck if app boot encounters errors
          setTimeout(function() {
            var splash = document.getElementById('app-launch-splash');
            if (!splash) return;
            var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            var reveal = function() {
              if (splash.parentNode) splash.parentNode.removeChild(splash);
              document.documentElement.classList.remove('up-preload');
              document.documentElement.classList.add('up-ready');
            };
            splash.classList.add('is-hidden');
            if (reduce) reveal();
            else setTimeout(reveal, 320);
          }, 5000);
        } catch (e) {}
      })();
    </script>
    <style>
      html, body, #root { background-color: #f7f8fb; }
      html.dark, html.dark body, html.dark #root { background-color: #070707; }

      #app-launch-splash {
        position: fixed;
        inset: 0;
        z-index: 999999;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #f7f8fb;
        transition: opacity 260ms cubic-bezier(0.3, 0.55, 0.3, 1), visibility 260ms;
        pointer-events: auto;
        user-select: none;
        -webkit-user-select: none;
      }
      html.dark #app-launch-splash {
        background-color: #070707;
      }
      .splash-body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        transform: translateZ(0);
        transition: transform 240ms cubic-bezier(0.3, 0.55, 0.3, 1), opacity 240ms cubic-bezier(0.3, 0.55, 0.3, 1);
      }
      .splash-logo {
        width: 72px;
        height: 72px;
        border-radius: 18px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
        transform: translateZ(0);
      }
      .splash-name {
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: #1b2430;
      }
      html.dark .splash-name {
        color: #ececec;
      }
      #app-launch-splash.is-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      #app-launch-splash.is-hidden .splash-body {
        opacity: 0;
        transform: scale(0.96);
      }
      @media (prefers-reduced-motion: reduce) {
        #app-launch-splash,
        .splash-body {
          transition-duration: 0.001ms !important;
        }
      }
    </style>
  </head>
  <body class="bg-[#f7f8fb] dark:bg-[#070707] text-slate-900 dark:text-slate-100 antialiased font-sans selection:bg-indigo-500 selection:text-white">
    <div id="app-launch-splash">
      <div class="splash-body">
        <img src="/icon.svg" width="72" height="72" class="splash-logo" alt="Uniplan" />
        <div class="splash-name">Uniplan</div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
