<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81" />
      <stop offset="50%" stop-color="#4338ca" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Inner calendar card -->
  <g filter="url(#shadow)">
    <rect x="76" y="96" width="360" height="330" rx="36" fill="#ffffff" fill-opacity="0.96" />
    <!-- Calendar Header Bar -->
    <path d="M 76 132 C 76 112 92 96 112 96 L 400 96 C 420 96 436 112 436 132 L 436 168 L 76 168 Z" fill="#4f46e5" />
    <!-- Binder rings -->
    <rect x="144" y="74" width="24" height="44" rx="12" fill="#e0e7ff" stroke="#312e81" stroke-width="4" />
    <rect x="244" y="74" width="24" height="44" rx="12" fill="#e0e7ff" stroke="#312e81" stroke-width="4" />
    <rect x="344" y="74" width="24" height="44" rx="12" fill="#e0e7ff" stroke="#312e81" stroke-width="4" />

    <!-- Schedule Columns / Blocks -->
    <!-- Column 1 -->
    <rect x="108" y="196" width="86" height="56" rx="10" fill="#3b82f6" fill-opacity="0.85" />
    <rect x="108" y="264" width="86" height="96" rx="10" fill="#10b981" fill-opacity="0.85" />

    <!-- Column 2 -->
    <rect x="213" y="196" width="86" height="92" rx="10" fill="#f97316" fill-opacity="0.85" />
    <rect x="213" y="300" width="86" height="60" rx="10" fill="#8b5cf6" fill-opacity="0.85" />

    <!-- Column 3 -->
    <rect x="318" y="196" width="86" height="68" rx="10" fill="#ec4899" fill-opacity="0.85" />
    <rect x="318" y="276" width="86" height="84" rx="10" fill="#06b6d4" fill-opacity="0.85" />

    <!-- Graduation cap floating badge -->
    <g transform="translate(320, 290)">
      <circle cx="50" cy="50" r="54" fill="#1e1b4b" stroke="#ffffff" stroke-width="6" />
      <!-- Cap diamond -->
      <polygon points="50,22 84,38 50,54 16,38" fill="url(#capGrad)" />
      <!-- Skull cap underside -->
      <path d="M 28 44 L 28 62 C 28 72 72 72 72 62 L 72 44" fill="none" stroke="#e0e7ff" stroke-width="5" stroke-linecap="round" />
      <!-- Tassel -->
      <path d="M 84 38 L 86 58 C 86 64 80 66 80 66" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" />
      <circle cx="80" cy="68" r="4" fill="url(#goldGrad)" />
    </g>
  </g>
</svg>
